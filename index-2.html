<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AskMe AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>AskMe AI</h1>
      <button id="clear" type="button">Clear chat</button>
    </header>
    <main id="chat"></main>
    <div id="loading" class="loading hidden">AI is typing…</div>
    <div class="input-bar">
      <input id="input" type="text" placeholder="Type your message…" autocomplete="off" />
      <button id="send" type="button">Send</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
